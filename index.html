<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatun Lake Live Transit Capacity</title>
    <!-- Load Chart.js, the Annotation plugin for background zones, and PapaParse -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        p { color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gatun Lake Live Water Level & Transit Capacity</h1>
    <p>Data automatically updates every 10 minutes. Refresh page for latest feed.</p>
    <canvas id="gatunChart" width="800" height="400"></canvas>
</div>

<script>
    Papa.parse("live_feed.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            const data = results.data;
            
            const labels = data.map(row => row.Timestamp);
            const waterLevels = data.map(row => parseFloat(row.Value));
            
            const fullyOperational = Array(data.length).fill(86.0);
            const restricted = Array(data.length).fill(84.0);
            const severe = Array(data.length).fill(80.0);

            const ctx = document.getElementById('gatunChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Gatun Lake Level (ft)',
                            data: waterLevels,
                            borderColor: '#002060', // Darkened to navy blue for high contrast against the colored zones
                            borderWidth: 3,
                            fill: false, // Removed the blue fill so the background zones are clearly visible
                            tension: 0.1,
                            pointRadius: 0
                        },
                        {
                            label: 'Fully Operational (86ft)',
                            data: fullyOperational,
                            borderColor: '#28a745',
                            borderDash: [5, 5],
                            borderWidth: 2,
                            pointRadius: 0
                        },
                        {
                            label: 'Restricted Warning (84ft)',
                            data: restricted,
                            borderColor: '#ffc107',
                            borderDash: [5, 5],
                            borderWidth: 2,
                            pointRadius: 0
                        },
                        {
                            label: 'Severe Restriction (80ft)',
                            data: severe,
                            borderColor: '#dc3545',
                            borderDash: [5, 5],
                            borderWidth: 2,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        annotation: {
                            annotations: {
                                // Zone 1: > 86 (Green)
                                fullyOpZone: {
                                    type: 'box',
                                    yMin: 86,
                                    yMax: 92,
                                    backgroundColor: 'rgba(40, 167, 69, 0.15)', // 15% opacity green
                                    borderWidth: 0
                                },
                                // Zone 2: 84 to 86 (Orange)
                                restrictedZone: {
                                    type: 'box',
                                    yMin: 84,
                                    yMax: 86,
                                    backgroundColor: 'rgba(255, 193, 7, 0.15)', // 15% opacity orange
                                    borderWidth: 0
                                },
                                // Zone 3: < 80 (Red)
                                severeZone: {
                                    type: 'box',
                                    yMin: 75,
                                    yMax: 80,
                                    backgroundColor: 'rgba(220, 53, 69, 0.15)', // 15% opacity red
                                    borderWidth: 0
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            min: 75,
                            max: 92,
                            title: { display: true, text: 'Elevation (Feet)' }
                        },
                        x: {
                            title: { display: true, text: 'Timestamp (Local Time)' }
                        }
                    },
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    }
                }
            });
        }
    });
</script>

</body>
</html>
