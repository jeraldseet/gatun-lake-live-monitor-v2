name: Gatun Lake Monitor

on:
  workflow_dispatch: # Solely relies on external triggers like cron-job.org

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    # Explicitly grant the action permission to push code back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run script
        run: python monitor.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add live_feed.csv
          git commit -m "Automated update: live feed" || exit 0
          git push
