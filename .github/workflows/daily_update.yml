name: Daily Historical Append
on:
  schedule:
    # Runs at 04:55 UTC (which is 11:55 PM EST / Panama Time)
    - cron: '55 4 * * *'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  append-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Daily Append Script
        run: python daily_append_historical.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add Download_Gatun_Lake_Water_Level_History.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily historical data append" && git push)
